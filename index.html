<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c66f5" />
    <!-- 나눔스퀘어 네오 웹폰트 CDN. 미리 연결해 두면 첫 렌더가 빨라진다 -->
    <link rel="preconnect" href="https://hangeul.pstatic.net" crossorigin />
    <meta name="description" content="지금 이 시간 문 연 약국과 병·의원을 반경 3km 이내에서 찾아드립니다." />
    <title>오늘 문 연 약국·의원</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      흰 화면 방지 1 — 번들 로드 실패 시 한 번만 자동 새로고침.
      배포로 에셋 해시가 바뀐 뒤 브라우저가 옛 HTML 을 캐시하고 있으면 사라진 번들을 요청해
      아무것도 그려지지 않는다. 캐시를 우회해 다시 받는다. (무한 새로고침 방지를 위해 1회)
    -->
    <script>
      (function () {
        var KEY = 'medi365:reloaded';
        window.addEventListener(
          'error',
          function (e) {
            var el = e.target;
            if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
            if (sessionStorage.getItem(KEY)) return;
            try { sessionStorage.setItem(KEY, '1'); } catch (_) {}
            location.replace(location.pathname + '?v=' + Date.now());
          },
          true,
        );
        window.addEventListener('load', function () {
          setTimeout(function () {
            try { sessionStorage.removeItem(KEY); } catch (_) {}
          }, 5000);
        });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
