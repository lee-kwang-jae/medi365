name: 응급의료포털 데이터 갱신

# 앱은 미리 받아둔 정적 데이터를 먼저 보여준다. 이 작업이 그 데이터를 채운다.
#
# 3시간마다 시도하되, 데이터가 이미 20시간 이내면 아무것도 하지 않는다.
#   · 평소      → 하루 한 번만 실제로 수집한다
#   · 상류 장애 → 실패해도 3시간 뒤 다시 시도한다.
#                 E-Gen 이 복구되면 최대 3시간 안에 자동으로 따라잡는다
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '신선도 확인을 건너뛰고 강제로 수집'
        type: boolean
        default: false

permissions:
  contents: write

# 앞선 실행이 아직 돌고 있으면 기다린다 (같은 파일을 건드리므로 겹치면 안 된다)
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 상류가 느려 전국 수집에 시간이 걸린다 (재시도 포함)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 전국 데이터 수집
        env:
          EGEN_SERVICE_KEY: ${{ secrets.EGEN_SERVICE_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$EGEN_SERVICE_KEY" ]; then
            echo "::error::secrets.EGEN_SERVICE_KEY 가 없습니다."
            exit 1
          fi
          if [ "$FORCE" = "true" ]; then
            node scripts/fetch-data.mjs
          else
            node scripts/fetch-data.mjs --if-older-than 20
          fi

      # 수집이 실패하면 여기까지 오지 않는다 → 기존 데이터가 그대로 남는다
      - name: 변경분만 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음 — 커밋하지 않습니다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "chore(data): 응급의료포털 데이터 갱신 ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            # 3시간마다 도는 작업이라 그 사이 다른 커밋이 있을 수 있다
            git pull --rebase --autostash origin main
            git push
          fi

      - name: 결과 요약
        if: always()
        run: |
          if [ -f public/data/index.json ]; then
            node -e "
              const i = require('./public/data/index.json');
              console.log('갱신 시각:', i.generatedAt);
              console.log('전국 완료:', i.complete ? '예' : '아니오(부분)');
              for (const [k, v] of Object.entries(i.kinds || {})) {
                console.log('  ' + k + ': ' + (v.count ?? '-') + '건 · 격자 ' + v.cells + '개');
              }
            "
          else
            echo "데이터 파일 없음 — 아직 한 번도 수집되지 않았습니다."
          fi
