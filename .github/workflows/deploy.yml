name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 필수 설정 확인
        env:
          KAKAO_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
          PROXY_BASE: ${{ vars.VITE_EGEN_PROXY_BASE }}
        run: |
          missing=0
          [ -z "$KAKAO_KEY" ]  && echo "::error::secrets.VITE_KAKAO_JS_KEY 가 없습니다."      && missing=1
          [ -z "$PROXY_BASE" ] && echo "::error::vars.VITE_EGEN_PROXY_BASE 가 없습니다."      && missing=1
          [ "$missing" = "1" ] && exit 1
          echo "OK"

      - run: npm ci

      - name: Build
        env:
          # GitHub Pages 프로젝트 사이트 경로: /<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
          VITE_EGEN_PROXY_BASE: ${{ vars.VITE_EGEN_PROXY_BASE }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
